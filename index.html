<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Stok Opname</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --gray: #6b7280;
      --bg: #f3f4f6;
      --card: #ffffff;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      padding: 16px;
      min-height: 100vh;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
      padding: 24px;
    }
    h1 {
      text-align: center;
      font-size: 1.25rem;
      color: #1f2937;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-group { display: flex; gap: 8px; }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      outline: none;
      background-color: #fff;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    input.readonly { background-color: #f9fafb; color: #4b5563; cursor: not-allowed; }
    .btn-search {
      padding: 0 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-scan {
      padding: 0 16px;
      background: #f59e0b;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 24px;
    }
    .btn-group button {
      padding: 14px 4px;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.75rem;
      color: white;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .btn-save { background: var(--success); }
    .btn-back { background: var(--gray); }
    .btn-next { background: var(--primary); }
    .btn-delete { background: var(--danger); }
    #scanner-container {
      display: none;
      margin-top: 14px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--primary);
      position: relative;
    }
    #reader { width: 100%; }
    .close-scanner {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 10;
    }
    .status {
      margin-top: 16px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .status.show { display: block; }
    .status.success { background: #ecfdf5; color: #065f46; }
    .status.error { background: #fef2f2; color: #991b1b; }
    .status.info { background: #eff6ff; color: #1e40af; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .debug-bar {
      margin-top: 12px;
      font-size: 0.7rem;
      color: #9ca3af;
      text-align: center;
    }
    .debug-bar a { color: var(--primary); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>

<div class="container">
  <h1>Aplikasi Stok Opname</h1>

  <!-- Barcode / Nama Barang -->
  <div class="form-group">
    <label>Barcode / Nama Barang</label>
    <div class="input-group">
      <input type="text" id="keyword" placeholder="Scan barcode atau ketik nama..." 
             onkeypress="if(event.key==='Enter') cariBarang()">
      <button class="btn-search" onclick="cariBarang()">🔍</button>
      <button class="btn-scan" onclick="mulaiScan()">📷</button>
    </div>
    <div class="debug-bar">
      Mode cari: <a onclick="setSearchBy('auto')" id="modeAuto">Auto</a> | 
      <a onclick="setSearchBy('barcode')" id="modeBarcode">Barcode</a> | 
      <a onclick="setSearchBy('nama')" id="modeNama">Nama</a>
      <span id="currentMode" style="font-weight:bold;">(Auto)</span>
    </div>
  </div>

  <!-- Scanner Area -->
  <div id="scanner-container">
    <button class="close-scanner" onclick="hentikanScan()">✕</button>
    <div id="reader"></div>
  </div>

  <!-- Nama Barang -->
  <div class="form-group">
    <label>Nama Barang</label>
    <input type="text" id="namaBarang" class="readonly" readonly placeholder="-">
  </div>

  <!-- Qty System & Qty Gudang -->
  <div class="grid-2">
    <div class="form-group">
      <label>Qty System</label>
      <input type="number" id="qtySystem" class="readonly" readonly>
    </div>
    <div class="form-group">
      <label>Qty Gudang</label>
      <input type="number" id="qtyGudang" class="readonly" readonly>
    </div>
  </div>

  <!-- Qty Sales -->
  <div class="form-group">
    <label>Qty Sales Periode</label>
    <input type="number" id="qtySales" class="readonly" readonly>
  </div>

  <!-- Qty Fisik -->
  <div class="form-group">
    <label>Qty Fisik</label>
    <input type="number" id="qtyFisik" placeholder="Ketik qty fisik...">
  </div>

  <!-- Tombol Aksi -->
  <div class="btn-group">
    <button class="btn-save" onclick="simpan()">💾<br>Save</button>
    <button class="btn-back" onclick="resetForm()">↩️<br>Back</button>
    <button class="btn-next" onclick="nextItem()">⏭️<br>Next</button>
    <button class="btn-delete" onclick="hapusItem()">🗑️<br>Delete</button>
  </div>

  <div id="statusMessage" class="status"></div>

  <div class="debug-bar">
    <a onclick="testConnection()">[Test Koneksi Server]</a>
  </div>
</div>

<script>
  // ====== KONFIGURASI ======
  // GANTI dengan URL Web App Apps Script Anda
  // Format: https://script.google.com/macros/s/XXXXXXXX/exec
  const API_URL = 'https://script.google.com/macros/s/AKfycbzA7sxHelphC-CmxWsD5guPqVMbSDnzPf9ZXVcOMs72Ekz5FVO705d8xgzqIGd0-ZyXpg/exec';

  let html5QrCode;
  let currentData = null;
  let searchBy = 'auto'; // 'auto' | 'barcode' | 'nama'

  // ================= API CALL =================
  async function callAPI(action, params = {}) {
    // Validasi URL
    if (!API_URL || API_URL.includes('URL_WEB_APP_ANDA')) {
      return { success: false, message: 'API_URL belum diisi. Silakan edit file index.html.' };
    }

    // Gunakan GET untuk fleksibilitas (bisa juga POST)
    const query = new URLSearchParams();
    query.append('action', action);
    for (const key in params) {
      query.append(key, typeof params[key] === 'object' ? JSON.stringify(params[key]) : params[key]);
    }

    try {
      const response = await fetch(API_URL + '?' + query.toString(), {
        method: 'GET',
        redirect: 'follow'
      });
      
      if (!response.ok) {
        return { success: false, message: 'HTTP Error: ' + response.status };
      }
      
      const text = await response.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        return { success: false, message: 'Response bukan JSON: ' + text.substring(0, 100) };
      }
    } catch (err) {
      return { success: false, message: 'Gagal fetch: ' + err.message };
    }
  }

  // ================= MODE PENCARIAN =================
  function setSearchBy(mode) {
    searchBy = mode;
    document.getElementById('currentMode').innerText = '(' + mode + ')';
    // Highlight mode aktif
    ['modeAuto', 'modeBarcode', 'modeNama'].forEach(id => {
      document.getElementById(id).style.fontWeight = 'normal';
    });
    const idMap = { auto: 'modeAuto', barcode: 'modeBarcode', nama: 'modeNama' };
    document.getElementById(idMap[mode]).style.fontWeight = 'bold';
  }

  // ================= CARI BARANG =================
  async function cariBarang() {
    const keyword = document.getElementById('keyword').value.trim();
    if (!keyword) {
      setStatus("Masukkan barcode atau nama barang.", "error");
      return;
    }

    setStatus("Mencari...", "info");

    const res = await callAPI('getBarang', { 
      keyword: keyword, 
      searchBy: searchBy 
    });

    if (res && res.found) {
      currentData = res;
      document.getElementById('namaBarang').value = res.namaBarang;
      document.getElementById('qtySystem').value = res.qtySystem;
      document.getElementById('qtyGudang').value = res.qtyGudang;
      document.getElementById('qtySales').value = res.qtySales;
      document.getElementById('qtyFisik').value = '';
      document.getElementById('qtyFisik').focus();
      setStatus("✓ " + res.namaBarang, "success");
    } else {
      currentData = null;
      clearInputFields();
      setStatus(res && res.message ? res.message : "Barang tidak ditemukan", "error");
    }
  }

  // ================= SIMPAN =================
  async function simpan() {
    if (!currentData) {
      setStatus("Cari barang terlebih dahulu.", "error");
      return;
    }
    const qtyFisik = document.getElementById('qtyFisik').value;
    if (qtyFisik === '' || isNaN(qtyFisik)) {
      setStatus("Qty Fisik harus diisi angka.", "error");
      return;
    }

    const dataToSave = {
      barcode: currentData.barcode,
      namaBarang: currentData.namaBarang,
      harga: currentData.harga,
      qtySystem: currentData.qtySystem,
      qtySales: currentData.qtySales,
      qtyFisik: qtyFisik
    };

    setStatus("Menyimpan...", "info");
    const res = await callAPI('simpanSO', { dataSO: dataToSave });

    if (res.success) {
      setStatus("✓ Data berhasil disimpan!", "success");
      setTimeout(resetForm, 1200);
    } else {
      setStatus("Gagal: " + res.message, "error");
    }
  }

  // ================= HELPER =================
  function resetForm() {
    document.getElementById('keyword').value = '';
    clearInputFields();
    currentData = null;
    setStatus('', '');
    hentikanScan();
    document.getElementById('keyword').focus();
  }

  function clearInputFields() {
    document.getElementById('namaBarang').value = '';
    document.getElementById('qtySystem').value = '';
    document.getElementById('qtyGudang').value = '';
    document.getElementById('qtySales').value = '';
    document.getElementById('qtyFisik').value = '';
  }

  function nextItem() {
    resetForm();
  }

  function hapusItem() {
    document.getElementById('qtyFisik').value = '';
    setStatus("Input Qty Fisik dihapus.", "info");
  }

  function setStatus(msg, type) {
    const el = document.getElementById('statusMessage');
    if (!msg) { el.classList.remove('show'); el.innerText = ''; return; }
    el.innerText = msg;
    el.className = 'status show ' + (type || 'info');
  }

  // ================= SCANNER =================
  function mulaiScan() {
    const container = document.getElementById('scanner-container');
    container.style.display = 'block';
    setStatus("Menyiapkan kamera...", "info");

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("Browser tidak mendukung akses kamera.", "error");
      container.style.display = 'none';
      return;
    }

    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("reader");
    }

    const config = {
      fps: 10,
      qrbox: (w, h) => {
        const min = Math.min(w, h);
        return { width: Math.floor(min * 0.9), height: Math.floor(min * 0.5) };
      },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        document.getElementById('keyword').value = decodedText;
        setSearchBy('barcode');
        hentikanScan();
        cariBarang();
      },
      () => {} // ignore frame errors
    ).then(() => {
      setStatus("Arahkan kamera ke barcode...", "info");
    }).catch((err) => {
      setStatus("Gagal akses kamera: " + err, "error");
      container.style.display = 'none';
    });
  }

  function hentikanScan() {
    if (html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => {
        document.getElementById('scanner-container').style.display = 'none';
      }).catch(() => {
        document.getElementById('scanner-container').style.display = 'none';
      });
    } else {
      document.getElementById('scanner-container').style.display = 'none';
    }
  }

  // ================= TEST KONEKSI =================
  async function testConnection() {
    setStatus("Menguji koneksi ke server...", "info");
    const res = await callAPI('ping');
    if (res.success) {
      setStatus("✓ Server terhubung! " + (res.time || ''), "success");
    } else {
      setStatus("✗ Gagal: " + res.message, "error");
    }
  }

  // Set mode default
  setSearchBy('auto');
</script>

</body>
</html>
