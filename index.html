<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Stok Opname</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; display: none; }
  </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">

  <div class="bg-white p-6 rounded-xl shadow-lg w-full max-w-sm mb-4">
    <h1 class="text-xl font-bold text-center text-blue-900 mb-6">Aplikasi Stok Opname</h1>

    <!-- Area Kamera -->
    <div id="reader" class="mb-4 border-2 border-blue-500"></div>

    <!-- Barcode / Pencarian -->
    <div class="mb-4 relative">
      <label class="block text-sm font-bold text-gray-700 mb-1">BARCODE / NAMA BARANG</label>
      <div class="flex gap-2">
        <input type="text" id="barcode" placeholder="Scan atau ketik..." class="flex-1 border border-gray-300 rounded-md p-2 focus:outline-none focus:border-blue-500" onkeypress="handleEnter(event)" autocomplete="off">
        <button onclick="startCamera()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded-md flex items-center justify-center">
          📷
        </button>
      </div>
      <div id="searchResults" class="hidden absolute z-10 w-full bg-white border border-gray-300 mt-1 rounded-md shadow-lg max-h-48 overflow-y-auto"></div>
    </div>

    <div class="mb-4">
      <label class="block text-sm font-bold text-gray-700 mb-1">NAMA BARANG</label>
      <input type="text" id="namaBarang" value="-" readonly class="w-full border border-gray-200 bg-gray-50 rounded-md p-2">
    </div>

    <div class="flex gap-4 mb-4">
      <div class="flex-1">
        <label class="block text-sm font-bold text-gray-700 mb-1">HARGA</label>
        <input type="text" id="harga" readonly class="w-full border border-gray-200 bg-gray-50 rounded-md p-2">
      </div>
      <div class="flex-1">
        <label class="block text-sm font-bold text-gray-700 mb-1">QTY ISELLER</label>
        <input type="text" id="qtyIseller" readonly class="w-full border border-gray-200 bg-gray-50 rounded-md p-2">
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-bold text-gray-700 mb-1">QTY FISIK</label>
      <input type="number" id="qtyFisik" placeholder="Ketik qty fisik..." class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:border-blue-500 text-lg">
    </div>

    <!-- Tombol Aksi -->
    <div class="grid grid-cols-2 gap-2 mb-4">
      <button onclick="simpanSementara()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 rounded-md flex items-center justify-center gap-2">
        💾 Simpan (HP)
      </button>
      <button onclick="resetForm()" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 rounded-md flex items-center justify-center gap-2">
        ↩️ Reset
      </button>
    </div>
    
    <button onclick="syncKeSpreadsheet()" class="w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-3 rounded-md flex items-center justify-center gap-2 shadow-md">
      ☁️ Upload ke Spreadsheet (<span id="queueCount">0</span>)
    </button>
  </div>

  <!-- Tabel Data Sementara -->
  <div class="bg-white p-4 rounded-xl shadow-lg w-full max-w-sm mb-8">
    <h2 class="font-bold text-gray-700 mb-2">Data di HP (Belum di-upload)</h2>
    <div class="overflow-x-auto">
      <table class="w-full text-xs text-left border-collapse">
        <thead class="bg-gray-100">
          <tr>
            <th class="p-2 border-b">Barcode</th>
            <th class="p-2 border-b">Fisik</th>
            <th class="p-2 border-b">Selisih</th>
          </tr>
        </thead>
        <tbody id="tabelSementara">
          <!-- Diisi via JS -->
        </tbody>
      </table>
    </div>
    <button onclick="hapusSemuaData()" class="mt-4 w-full bg-red-500 text-white text-sm py-2 rounded">Kosongkan Data HP</button>
  </div>

  <script>
    // ================= KONFIGURASI =================
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP DARI APPS SCRIPT ANDA!
    const GAS_URL = 'URL_WEB_APP_ANDA_DISINI'; 
    // ===============================================

    let html5QrcodeScanner;
    let dataSementara = JSON.parse(localStorage.getItem('so_data_hp')) || [];

    document.addEventListener('DOMContentLoaded', () => {
      updateTabelSementara();
    });

    function handleEnter(e) {
      if (e.key === 'Enter') { scanBarcode(); }
    }

    // --- KAMERA (HTML5-QRCode) ---
    function startCamera() {
      const readerDiv = document.getElementById('reader');
      
      if (readerDiv.style.display === 'block') {
        html5QrcodeScanner.clear();
        readerDiv.style.display = 'none';
        return;
      }

      readerDiv.style.display = 'block';
      html5QrcodeScanner = new Html5Qrcode("reader");
      
      html5QrcodeScanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          // Saat sukses scan
          document.getElementById('barcode').value = decodedText;
          html5QrcodeScanner.clear();
          readerDiv.style.display = 'none';
          scanBarcode(decodedText); 
        },
        (errorMessage) => { /* Abaikan error per-frame */ }
      ).catch(err => {
        alert("Kamera gagal diakses. Pastikan Anda menggunakan HTTPS (GitHub Pages) dan memberi izin kamera.");
        readerDiv.style.display = 'none';
      });
    }

    // --- PENCARIAN DATA API ---
    function scanBarcode(forceBarcode = null) {
      const inputVal = forceBarcode || document.getElementById('barcode').value.trim();
      if (!inputVal) return alert('Barcode / Nama tidak boleh kosong!');
      
      document.getElementById('searchResults').classList.add('hidden');
      
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getData', input: inputVal, mode: 'search' })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          const response = res.data;
          if (response.isSearch) {
            if (response.data.length > 0) {
              showSearchResults(response.data);
            } else {
              fetchExactBarcode(inputVal);
            }
          }
        }
      }).catch(err => alert("Error koneksi: " + err));
    }

    function fetchExactBarcode(barcode) {
      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getData', input: barcode, mode: 'barcode' })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          if (res.data.namaBarang === '-') {
            alert('Barang tidak ditemukan!');
          } else {
            fillForm(res.data);
          }
        }
      });
    }

    function showSearchResults(results) {
      const container = document.getElementById('searchResults');
      container.innerHTML = '';
      
      results.slice(0, 10).forEach(item => {
        const div = document.createElement('div');
        div.className = 'p-3 border-b border-gray-100 hover:bg-blue-50 cursor-pointer text-sm';
        div.innerHTML = `<div class="font-bold text-gray-800">${item.namaBarang}</div>
                         <div class="text-gray-500 text-xs">SKU: ${item.barcode}</div>`;
        div.onclick = function() {
          container.classList.add('hidden');
          document.getElementById('barcode').value = item.barcode;
          fetchExactBarcode(item.barcode);
        };
        container.appendChild(div);
      });
      container.classList.remove('hidden');
    }

    function fillForm(data) {
      document.getElementById('barcode').value = data.barcode;
      document.getElementById('namaBarang').value = data.namaBarang;
      document.getElementById('harga').value = data.harga;
      // Kita asumsikan Qty Iseller = Qty System dari Stock&harga
      document.getElementById('qtyIseller').value = data.qtySystem; 
      document.getElementById('qtyFisik').focus();
    }

    // --- SIMPAN SEMENTARA (LOCAL STORAGE) ---
    function simpanSementara() {
      const barcode = document.getElementById('barcode').value;
      const namaBarang = document.getElementById('namaBarang').value;
      const harga = document.getElementById('harga').value;
      const qtyIseller = document.getElementById('qtyIseller').value;
      const qtyFisik = document.getElementById('qtyFisik').value;

      if (!barcode || !qtyFisik || namaBarang === '-') {
        return alert('Data belum lengkap! Scan barcode dan isi Qty Fisik.');
      }

      const selisih = Number(qtyFisik) - Number(qtyIseller);

      const newData = {
        barcode, namaBarang, harga, qtyIseller, qtyFisik, selisih,
        id: Date.now() // ID unik
      };

      dataSementara.push(newData);
      localStorage.setItem('so_data_hp', JSON.stringify(dataSementara));
      
      updateTabelSementara();
      resetForm();
      alert('Disimpan ke HP!');
    }

    function updateTabelSementara() {
      const tbody = document.getElementById('tabelSementara');
      const countLabel = document.getElementById('queueCount');
      tbody.innerHTML = '';
      countLabel.innerText = dataSementara.length;

      dataSementara.forEach((item, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-2 border-b text-xs">${item.barcode}</td>
          <td class="p-2 border-b text-xs">${item.qtyFisik}</td>
          <td class="p-2 border-b text-xs">${item.selisih}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function resetForm() {
      document.getElementById('barcode').value = '';
      document.getElementById('namaBarang').value = '-';
      document.getElementById('harga').value = '';
      document.getElementById('qtyIseller').value = '';
      document.getElementById('qtyFisik').value = '';
      document.getElementById('barcode').focus();
    }

    // --- UPLOAD SEMUA KE SPREADSHEET ---
    function syncKeSpreadsheet() {
      if (dataSementara.length === 0) return alert('Tidak ada data untuk di-upload.');

      const btn = event.target.closest('button');
      const originalText = btn.innerHTML;
      btn.innerHTML = 'Mengirim data...';
      btn.disabled = true;

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'saveBulk', data: dataSementara })
      })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert(res.data.message);
          dataSementara = [];
          localStorage.removeItem('so_data_hp');
          updateTabelSementara();
        } else {
          alert('Gagal upload: ' + res.message);
        }
      })
      .catch(err => alert('Error koneksi: ' + err))
      .finally(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
      });
    }

    function hapusSemuaData() {
      if (confirm('Yakin ingin menghapus semua data di HP? Data tidak akan masuk ke Spreadsheet.')) {
        dataSementara = [];
        localStorage.removeItem('so_data_hp');
        updateTabelSementara();
      }
    }
  </script>
</body>
</html>
